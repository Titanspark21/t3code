name: Sync upstream

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the customized branch
        uses: actions/checkout@v6
        with:
          ref: omni/main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --prune upstream main
          git fetch --prune origin main omni/main

      - name: Fast-forward the upstream mirror
        continue-on-error: true
        run: git push origin upstream/main:main

      - name: Merge upstream into the customized branch
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge --no-edit upstream/main; then
            git push origin HEAD:omni/main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conflicts="$(git diff --name-only --diff-filter=U | paste -sd ', ' -)"
          git merge --abort
          echo "conflicts=$conflicts" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Report a merge conflict
        if: failure() && steps.merge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          title="Upstream sync needs conflict resolution"
          body="The scheduled merge of pingdotgg/t3code main into omni/main could not complete. Conflicting paths: ${CONFLICTS:-unknown}. No fork changes were overwritten. Resolve the conflict locally and push omni/main; the next scheduled run will resume automatic syncing."
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
